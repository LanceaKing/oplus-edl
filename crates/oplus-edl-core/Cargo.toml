[package]
name = "oplus-edl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
usb = ["qdl/usb"]
serial = ["qdl/serial"]
desktop-host = ["usb", "serial"]
cloud = [
    "dep:hmac", "dep:rand", "dep:wreq", "dep:tokio", "dep:futures-util",
    "dep:url", "dep:aes-gcm", "dep:base64", "dep:ed25519-dalek",
    "dep:curve25519-dalek", "dep:p256",
]
test-support = []

[[test]]
name = "session"
required-features = ["test-support"]

[[test]]
name = "service"
required-features = ["cloud", "test-support"]

[dependencies]
anyhow.workspace = true
qdl.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
rand = { version = "0.9", optional = true }
wreq = { version = "=0.16.3", features = ["json", "stream"], optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
url = { version = "2", optional = true }
xmltree = "0.11"
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2", optional = true }
curve25519-dalek = { version = "4", optional = true }
p256 = { version = "0.13", optional = true }

[dev-dependencies]
gptman = "1.1.2"
bincode = "1.3"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
