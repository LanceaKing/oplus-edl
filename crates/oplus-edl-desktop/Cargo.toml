[package]
name = "oplus-edl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oplus-edl-desktop"
path = "src/main.rs"

[features]
default = ["usb", "serial", "cloud"]
usb = ["oplus-edl-core/usb"]
serial = ["oplus-edl-core/serial"]
cloud = ["oplus-edl-core/cloud"]

[dependencies]
oplus-edl-core = { path = "../oplus-edl-core" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow", "wayland", "x11"] }
egui_extras = { version = "=0.37.0", default-features = false }
rfd = { version = "=0.18.0", default-features = false, features = ["wayland", "xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
oplus-edl-core = { path = "../oplus-edl-core", features = ["cloud", "test-support"] }
oplus-edl-cli = { path = "../oplus-edl-cli", default-features = false }
anyhow.workspace = true
qdl.workspace = true
clap.workspace = true
gptman = "1.1.2"
sha2 = "0.10"
xmltree = "0.11"
