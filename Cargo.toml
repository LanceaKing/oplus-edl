[package]
name = "oplus-edl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[test]]
name = "json_stdout"
harness = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# Shared storage API; publication evidence: docs/implementation/shared-storage-publish/README.md.
qdl = { git = "https://github.com/LanceaKing/qdlrs", rev = "205c7d4d9f15add22d78c422ba77843ab72c95d4", features = ["usb", "serial"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
wreq = { version = "=0.16.3", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
url = "2"
xmltree = "0.11"
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
curve25519-dalek = "4"
p256 = "0.13"

[dev-dependencies]
gptman = "1.1.2"
bincode = "1.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
