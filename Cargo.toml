[workspace]
members = ["crates/oplus-edl-core", "crates/oplus-edl-cli", "crates/oplus-edl-desktop"]
default-members = ["crates/oplus-edl-cli", "crates/oplus-edl-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
qdl = { git = "https://github.com/LanceaKing/qdlrs", rev = "9161c0f46cef245f3b5fc5394dba1ec5e8c3f6ac", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3"
libc = "0.2"
