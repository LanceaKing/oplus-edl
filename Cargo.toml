[package]
name = "oplus-edl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[test]]
name = "json_stdout"
harness = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gptman = "1.1.2"
qdl = { git = "https://github.com/LanceaKing/qdlrs", rev = "a80cd1e8cd1cd60634b9c5ce9a4c8c96b727c003", features = ["usb", "serial"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xmltree = "0.11"

[dev-dependencies]
bincode = "1.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
