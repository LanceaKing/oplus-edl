#
# md5checksumtool config file.
# @need_checksum: a flag to check if the partition need do checksum
# @image_type:    it has two type: RAW and EXT4, if the binary is packaged
#                   as ext4 format, it should be EXT4, otherwise its RAW
# @partition:     the partition need to be checksum in the devices
# @path:          the file used to generate md5 checksum
#
# notice: the md5 partition should excluded, or it will lead checksum failed.
# <image_type>  <partition>  <path>

## This is LUN 0 - HLOS LUN"
EXT4           cache         cache.img
RAW            devcfg        devcfg.mbn
RAW            devcfgbak     devcfg.mbn

## This is LUN 1 - Boot LUN A"
RAW            xbl           xbl.elf
## This is LUN 2 - Boot LUN B"
RAW            xblbak        xbl.elf

## This is LUN 4 - Protected Read-only LUN"
RAW            rpm           rpm.mbn
RAW            rpmbak        rpm.mbn
RAW            tz            tz.mbn
RAW            tzbak         tz.mbn
RAW            hyp           hyp.mbn
RAW            hypbak        hyp.mbn
RAW            sec           sec.dat
RAW            pmic          pmic.elf
RAW            pmicbak       pmic.elf
RAW            modem         NON-HLOS.bin
RAW            dsp           adspso.bin
RAW            mdtp          mdtp.img
RAW            aboot         emmc_appsboot.mbn
RAW            abootbak      emmc_appsboot.mbn
RAW            boot          boot.img
RAW            boot_aging    boot_aging.img
EXT4           system        system.img
RAW            recovery      recovery.img
RAW            bluetooth     BTFM.bin
RAW            keymaster     keymaster.mbn
RAW            keymasterbak  keymaster.mbn
RAW            cmnlib        cmnlib.mbn
RAW            cmnlibbak     cmnlib.mbn
RAW            cmnlib64      cmnlib64.mbn
RAW            cmnlib64bak   cmnlib64.mbn
RAW            apdp          apdp.mbn
RAW            msadp         msadp.mbn



