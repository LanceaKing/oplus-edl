name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Native checks and packaging (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            suffix: linux-x86_64.tar.gz
          # Deploy to macOS 14. The macOS 14 hosted runner has been retired.
          - runner: macos-15
            artifact: macos-arm64
            suffix: macos-arm64.zip
          - runner: windows-2025
            artifact: windows-x86_64
            suffix: windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # wreq -> btls-sys builds BoringSSL and generates bindings with libclang.
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake strawberryperl pkgconfiglite llvm nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Install Rust and check components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record native toolchain
        run: |
          git rev-parse HEAD
          rustc +stable -Vv
          cargo +stable -V
      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Build
        run: cargo +stable build --workspace --all-features --locked --offline
      # Default tests include loopback HTTP fixtures; live cloud probes stay ignored.
      - name: Offline tests (no hardware or live services)
        run: cargo +stable test --workspace --all-features --locked --offline
      - name: Core API without default features
        run: cargo +stable test -p oplus-edl-core --no-default-features --test public_api --locked --offline
      - name: Session response waits without cloud or native transport
        run: cargo +stable test -p oplus-edl-core --no-default-features --features test-support --test session --locked --offline
      - name: Desktop and CLI parity without native transport
        run: cargo +stable test -p oplus-edl-desktop --no-default-features --test app --test frontend_parity --locked --offline
      - name: Verify the desktop qualification fixture
        run: cargo +stable test -p oplus-edl-desktop --no-default-features --example native-qualification --locked --offline
      - name: Build and verify desktop release archive (macOS or Linux)
        if: runner.os != 'Windows'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: sh scripts/package-desktop.sh
      - name: Build and verify desktop release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./scripts/package-desktop.ps1
      - name: Upload verified archive to this CI run
        uses: actions/upload-artifact@v4
        with:
          name: oplus-edl-${{ matrix.artifact }}
          path: dist/oplus-edl-*-${{ matrix.suffix }}
          if-no-files-found: error
