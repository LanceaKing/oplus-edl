name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # wreq -> btls-sys builds BoringSSL and generates bindings with libclang.
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake strawberryperl pkgconfiglite llvm nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Install Rust and check components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record native toolchain
        run: |
          rustc +stable -Vv
          cargo +stable -V
      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Build
        run: cargo +stable build --workspace --all-features --locked --offline
      # Default tests include loopback HTTP fixtures; live cloud probes stay ignored.
      - name: Offline tests (no hardware or live services)
        run: cargo +stable test --workspace --all-features --locked --offline
